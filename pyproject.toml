[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matchstick-man"
description = "A 2D platformer in 8-bit console aesthetic, built with Pyxel."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Erik S. Bailey", email = "esbailey@me.com" },
]
keywords = ["game", "pyxel", "platformer", "2d", "8-bit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = [
    "pyxel==2.9.4",
]
dynamic = ["version"]

[project.scripts]
matchstick-man = "matchstick_man.__main__:main"

[project.urls]
Repository = "https://github.com/esba1ley/Matchstick_Man"

[tool.hatch.version]
path = "src/matchstick_man/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/matchstick_man"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "D",    # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/matchstick_man/__init__.py" = ["D104"]
"src/matchstick_man/__main__.py" = ["D100"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"
